[versions]
# --- Build, Plugins & Compilers ---
agp = "9.2.1"
kotlin = "2.3.21"
compileSdk = "37"
minSdk = "26"
targetSdk = "37"
jvmTarget = "21"
ksp = "2.3.6"
hotSwanCompiler = "1.3.3"
google-services = "4.4.4"
detekt = "1.23.8"
kover = "0.9.8"
ktlint = "14.2.0"

# --- AndroidX, Core & Lifecycle ---
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
# --- Jetpack Compose & UI ---
browser = "1.10.0"
composeBom = "2026.05.01"
composeMaterialIcons = "1.7.8"
constraintlayoutCompose = "1.1.1"
compose-shimmer = "1.4.0"
fancyComposeAlertDialog = "1.0.2"

# --- Coroutines ---
coroutines = "1.11.0"

# --- Injeção de Dependências (Koin Annotations) ---
koin = "4.2.1"
koin-annotations = "4.2.1"
koinCompiler = "1.0.0"

# --- Arquitetura Offline-First (Room 3) ---
room = "3.0.0-alpha06"

# --- Navegação & Serialização ---
navigation3 = "1.1.2"
lifecycleViewmodelNavigation3 = "2.10.0"
materialAdaptiveNavigation3 = "1.2.0"
kotlinxSerializationCore = "1.11.0"

# --- Imagens & Network ---
coil = "3.4.0"
okhttp = "5.3.2"
ktor = "3.5.0"

# --- Inteligência Artificial ---
generativeai = "0.9.0"

# --- Firebase ---
firebaseBom = "34.14.0"
credentials = "1.6.0"
googleid = "1.2.0"

# --- Testes & Qualidade ---
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.16.1"

[libraries]
# --- AndroidX & Core ---
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activityCompose" }

# --- Jetpack Compose UI & Material ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "composeMaterialIcons" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIcons" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintlayoutCompose" }
compose-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version.ref = "compose-shimmer"}
compose-alert-dialog = { group = "com.github.PratikFagadiya", name = "FancyJetpackComposeDialog", version.ref = "fancyComposeAlertDialog" }

# --- Coroutines ---
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# --- Navegação Absoluta (Navigation 3) ---
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNavigation3" }
androidx-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "materialAdaptiveNavigation3" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }

# --- Injeção de Dependências (Koin) ---
koin = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-annotation = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koin-annotations" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# --- Banco de Dados (Room Offline-First) ---
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }

# --- Network & Imagens (Coil) ---
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil"}
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil"}
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- Firebase & Inteligência Artificial ---
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
generativeai = { module = "com.google.ai.client.generativeai:generativeai", version.ref = "generativeai" }

# --- Testes Unitários & Qualidade ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
mockk-io = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric"}
turbine-test = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine"}
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
coil-test = { group = "io.coil-kt.coil3", name = "coil-test", version.ref = "coil"}

[bundles]
coroutines = ["coroutines", "coroutines-core"]
firebase = ["firebase-firestore", "firebase-auth", "firebase-storage", "androidx-credentials", "androidx-credentials-play-auth", "googleid"]
coil = ["coil-compose", "coil-network"]
ktor = ["ktor-client-core", "ktor-client-okhttp", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]
koin = ["koin", "koin-annotation", "koin-compose"]
koin-test = ["koin-test", "koin-test-junit"]
compose-icons = ["androidx-compose-material-icons-core", "androidx-compose-material-icons-extended"]
navigation = [
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui",
    "androidx-lifecycle-viewmodel-navigation3",
    "kotlinx-serialization-core",
    "androidx-material3-adaptive-navigation3"
]
test-core = ["coroutines-test", "mockwebserver", "mockk-android", "coil-test"]
compose-foundation = ["androidx-compose-foundation"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-gms-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
hotswan-compiler = { id = "com.github.skydoves.compose.hotswan.compiler", version.ref = "hotSwanCompiler" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koinCompiler" }
