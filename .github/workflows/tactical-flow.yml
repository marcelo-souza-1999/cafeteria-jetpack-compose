name: Tactical Flow (Develop Guard)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build_and_test:
    name: Inquisition & Skirmish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Arming the Forge (Permissions)
        run: chmod +x gradlew

      - name: Create Dummy google-services.json
        run: |
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0987654321abcdef",
                  "android_client_info": {
                    "package_name": "com.targaryen.cafeteria.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "dummy-web-client-id.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "dummy-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Static Inquisition (Detekt & Lint)
        run: ./gradlew detektAll lintDebug

      - name: Trench Warfare (Unit Tests & Kover)
        run: ./gradlew testDebugUnitTest koverHtmlReportDebug

      - name: Archive Kover Report
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: app/build/reports/kover/htmlDebug/

      - name: Sentinel AI Code Review (Gemini)
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop
          git diff origin/develop...HEAD > pr.diff
          chmod +x .github/scripts/gemini_review.sh
          ./.github/scripts/gemini_review.sh pr.diff